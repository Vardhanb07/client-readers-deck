<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add item | Readers Deck</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <header class="site-header">
      <div class="brand">
        <p class="eyebrow">Readers Deck Client</p>
        <h1>Add item</h1>
        <p class="subtitle">Add a reading item under a category.</p>
      </div>
    </header>

    <main>
      <section class="panel">
        <form id="add-item" class="stack">
          <label class="field">
            <span>Name</span>
            <input type="text" name="name" placeholder="Item name" required />
          </label>
          <label class="field">
            <span>Category</span>
            <select name="categoryId" id="category-select" required></select>
          </label>
          <div class="row">
            <label class="field">
              <span>Pages</span>
              <input type="number" name="pages" min="1" step="1" required />
            </label>
            <label class="field">
              <span>Current page</span>
              <input type="number" name="currentPage" min="0" step="1" required />
            </label>
          </div>
          <button type="submit">Add item</button>
        </form>
      </section>
    </main>

    <footer class="footer-nav">
      <a class="ghost-link" href="index.html">Back to list</a>
      <a class="ghost-link" href="add-category.html">Add category</a>
    </footer>

    <div id="header-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head">
          <h3>Set request header</h3>
        </div>
        <form id="header-form" class="stack">
          <label class="field">
            <span>Header key</span>
            <input type="text" name="headerKey" placeholder="key" required />
          </label>
          <label class="field">
            <span>Header value</span>
            <input type="text" name="headerValue" placeholder="value" required />
          </label>
          <button type="submit">Save header</button>
        </form>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
